services:
  hexagram:
    build: .
    image: hexagram:latest
    container_name: hexagram
    restart: unless-stopped
    ports:
      # 主機:容器   想改用其他主機 port 只改左邊，例如 "80:8080"
      - "8080:8080"
    environment:
      TZ: Asia/Taipei
      # PostgreSQL 連線資訊（連到外部既有的 postgres 容器）
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_USER: postgres
      PG_PASSWORD: postgres
      PG_DATABASE: hexagram
      DB_ENABLED: "1"
      # 管理員名單（email，多個用逗號分隔；值放在 .env，不進 git）
      ADMIN_EMAILS: "${ADMIN_EMAILS:-}"
      # Flask session 簽章用的金鑰（部署時請改成自己的）
      SECRET_KEY: "${SECRET_KEY:-please-change-me-in-production}"
      # Claude API 金鑰（值放在 .env，不進 git；此處僅引用變數）
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      # 寄信（忘記密碼用）；值放 .env，未設定則連結只進 log
      # 優先用 Resend API（設了 RESEND_API_KEY 就走它），否則退回下方 SMTP
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      # 成長反思 Email 回訪派送端點的授權 token(每日排程 curl 用)
      CRON_TOKEN: "${CRON_TOKEN:-}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      MAIL_FROM: "${MAIL_FROM:-}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-}"
    networks:
      - default          # hexagram 自己的 default network
      - postgres-net     # 連到 postgres 所在的外部 network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---- 自動備份 hexagram 資料庫(每日 pg_dump + gzip + 輪替保留)----
  db-backup:
    image: prodrigestivill/postgres-backup-local:18
    container_name: hexagram-db-backup
    restart: unless-stopped
    environment:
      TZ: Asia/Taipei
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: hexagram
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${PG_PASSWORD:-postgres}"
      SCHEDULE: "0 3 * * *"          # 每天凌晨 3 點(Asia/Taipei)
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "6"
      POSTGRES_EXTRA_OPTS: "--clean --if-exists"
    volumes:
      - ./backups:/backups          # 備份存到主機 ./backups(已 gitignore)
    networks:
      - postgres-net                # 連到 postgres 所在的外部 network

networks:
  postgres-net:
    external: true
    name: appnet
