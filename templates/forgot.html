{% extends "base.html" %}
{% block title %}忘記密碼 — 命卦排盤{% endblock %}

{% block content %}
<h1>忘記密碼</h1>
{% if sent %}
  <div class="flash flash-ok" style="max-width:400px; margin:10px 0;">
    若 <b>{{ email }}</b> 是已註冊的帳號,重設密碼連結已寄出,請至信箱收信(1 小時內有效)。
  </div>
  <p><a href="/login" style="color:#8b0000; font-weight:bold;">回登入</a></p>
{% else %}
<form method="post" action="/forgot" class="login-form">
  <input type="email" name="email" placeholder="輸入註冊的 Email"
         required autofocus autocomplete="email">
  <button type="submit">寄送重設連結</button>
  <p style="margin-top:14px; text-align:center; font-size:14px;">
    想起來了?<a href="/login" style="color:#8b0000;">回登入</a>
  </p>
</form>
{% endif %}
{% endblock %}
