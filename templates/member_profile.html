{% extends "base.html" %}
{% block title %}修改會員資料 — 命卦排盤{% endblock %}

{% block content %}
<a href="/member" class="back-link">← 回會員中心</a>
<h1>修改會員資料</h1>

<form method="post" action="/member/profile" style="max-width:440px;">
  <div style="margin-bottom:14px;">
    <label style="display:block; margin-bottom:4px; font-weight:600;">暱稱</label>
    <input type="text" name="display_name" value="{{ user.display_name or '' }}"
           placeholder="顯示名稱"
           style="width:100%; padding:8px; border:1px solid #aaa; border-radius:4px; box-sizing:border-box;">
  </div>

  <div style="margin-bottom:6px; font-weight:600;">生日(命盤排卦用)</div>
  <div style="font-size:12px; color:#888; margin-bottom:8px;">
    填寫後，會員中心就能一鍵查看您的命盤。可全部留空。時辰以 00:00 換日。
  </div>
  <div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center;">
    <input type="number" name="birth_y" value="{{ user.birth_y or '' }}" min="1900" max="2100"
           placeholder="年" style="width:80px; padding:7px; border:1px solid #aaa; border-radius:4px;"> 年
    <input type="number" name="birth_m" value="{{ user.birth_m or '' }}" min="1" max="12"
           placeholder="月" style="width:56px; padding:7px; border:1px solid #aaa; border-radius:4px;"> 月
    <input type="number" name="birth_d" value="{{ user.birth_d or '' }}" min="1" max="31"
           placeholder="日" style="width:56px; padding:7px; border:1px solid #aaa; border-radius:4px;"> 日
    <select name="birth_h" style="padding:7px; border:1px solid #aaa; border-radius:4px;">
      <option value="">時辰</option>
      {% for hv in range(24) %}
        <option value="{{ hv }}" {% if user.birth_h is not none and user.birth_h == hv %}selected{% endif %}>{{ '%02d' % hv }}</option>
      {% endfor %}
    </select> 時
  </div>

  {% if error %}<p class="err" style="margin-top:12px;">{{ error }}</p>{% endif %}

  <button type="submit" style="margin-top:18px; padding:10px 20px; background:#8b0000;
          color:#fff; border:none; border-radius:6px; font-size:16px; cursor:pointer;">
    儲存
  </button>
</form>
{% endblock %}
