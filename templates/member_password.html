{% extends "base.html" %}
{% block title %}修改密碼 — 命果 MINGO{% endblock %}

{% block content %}
<a href="/member" class="back-link">← 回會員中心</a>
<h1>修改密碼</h1>
{% if success %}
  <div class="flash flash-ok" style="max-width:360px; margin:10px 0;">✓ 密碼已更新。</div>
  <p><a href="/member" style="color:var(--primary); font-weight:bold;">回會員中心</a></p>
{% else %}
<form method="post" action="/member/password" class="login-form">
  <input type="password" name="current_password" placeholder="目前密碼"
         required autocomplete="current-password">
  <input type="password" name="new_password" placeholder="新密碼(至少 8 碼,英數混合)"
         required autocomplete="new-password">
  <input type="password" name="new_password2" placeholder="再次輸入新密碼"
         required autocomplete="new-password">
  <button type="submit">更新密碼</button>
  {% if error %}<p class="err" style="margin-top:10px;">{{ error }}</p>{% endif %}
</form>
{% endif %}
{% endblock %}
