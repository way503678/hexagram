{% extends "base.html" %}
{% block title %}命果 MINGO{% endblock %}

{% block content %}
<div class="landing">

  <div class="landing-top">
    <img class="landing-logo" src="{{ url_for('static', filename='mingo-logo.png') }}?v={{ asset_version }}" alt="命果 MINGO">
    <div class="landing-subtitle">看懂變化 · 走向更好的自己</div>
    <div class="landing-subtitle-en">KNOW THE CHANGE, WALK YOUR PATH.</div>
    <div class="landing-divider">
      <div class="line"></div>
      <div class="dot">✦</div>
      <div class="line"></div>
    </div>
    {% if not current_user %}
      <a class="landing-recovery" href="/forgot">忘記密碼或帳號被鎖？自行重設與解鎖</a>
    {% endif %}
  </div>

  <div class="landing-footer">
    <div>本系統依京房納甲法、野鶴派飛伏理論製作</div>
    <div>僅供研究參考,不能取代專業諮詢</div>
  </div>

</div>
{% endblock %}
